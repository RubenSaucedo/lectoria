version: 2

updates:
  # Runtime and development dependencies. Lectoria calls paid Azure APIs and
  # parses untrusted documents, so parser and SDK updates are security-relevant.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine updates keeps review focused; majors stay separate
      # because they can change the public API or the supported Node range.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Workflow actions are pinned to commit SHAs, so this is what keeps them
  # current. Without it, a pinned action silently rots.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

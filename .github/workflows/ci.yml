name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. CI only needs to read the repository; no job
# here writes to the repo, publishes a package, or comments on a pull request.
# This is set per workflow so it holds even if the repository-wide default
# is later widened.
permissions:
  contents: read

# Cancel older in-flight runs for the same branch so PRs that get pushed
# repeatedly don't queue up wasted runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to
      # point at new code. Dependabot keeps these current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # `npm ci` runs dependency lifecycle scripts, so don't leave the
          # job's credentials in .git/config where they could be read.
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (incl. tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm run audit:prod

  # Install the exact tarball with lifecycle scripts disabled, then import
  # the public API and invoke the packaged CLI.
  pack:
    name: pack (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
